[package]
name = "phototek"
version.workspace = true
description = "Cross-platform photo browser where the library is any folder"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[workspace]
# The library code is in `core`, shared with the NAS server (`server`).
members = ["core", "server", "plugins/photos"]

[workspace.package]
# The one version of the app, the core and the server.
version = "0.1.23"

[lib]
# The `_lib` suffix avoids a name clash between the library and the binary on Windows.
name = "phototek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the Objective-C bridge to ImageCaptureCore (iPhone import, macOS).
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.7"

# The desktop app: the library is on this computer, and every command runs
# here. The phone app only talks to a Phototek server (src/mobile.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
phototek-core = { path = "core", default-features = false }
# The runtime Tauri runs commands on, with more workers than its default
# (see `run` in lib.rs).
tokio = { version = "1", features = ["rt-multi-thread"] }
# The folders each system keeps app data in (see rename.rs).
dirs = "6"
tauri-plugin-dialog = "2"
percent-encoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
kamadak-exif = "0.6.2"
rayon = "1.12.0"
chrono = "0.4.45"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
fast_image_resize = "5.1.4"
getrandom = "0.3"
# Runs the face detection and recognition models (pure Rust, no system library).
tract-onnx = "0.23"
# Downloads those models the first time face grouping is switched on.
ureq = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# The phone app: its photo library, and sending photos to the server.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-photos = { path = "plugins/photos" }
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "ios")'.dependencies]
# One call to WKWebView, to let the page reach under the notch and the home
# indicator (see src/mobile.rs).
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Windows Portable Devices: phones and cameras on USB (camera_windows.rs).
windows = { version = "0.61", features = [
  "Win32_Devices_PortableDevices",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }


[features]
default = ["heic"]
# HEIC/HEIF support through the libheif system library, needed at build time.
# Has no effect on macOS, where HEIC always works.
heic = ["phototek-core/heic"]

[dev-dependencies]
tempfile = "3"
phototek-core = { path = "core", default-features = false, features = ["test-support"] }

# Optimize debug builds too: unoptimized image decoding and resizing are about
# 20x slower, far too slow to develop against. This must cover our own crate as
# well as the dependencies, because their generic code is compiled into ours.
[profile.dev]
opt-level = 2
